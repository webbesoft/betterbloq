name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: betterbloq_test
          MARIADB_USER: betterbloq_test
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'betterbloq_test' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: betterbloq_test
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, intl, bcmath, gd
          tools: composer:v2
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install PHP dependencies before building Ziggy assets
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build assets
        run: bun --bun run build
      - name: Run test suite
        run: php vendor/bin/pest --compact
